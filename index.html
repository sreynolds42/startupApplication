<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Echo Ignition</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Compact Header Banner with Integrated Login -->
  <header class="top-banner">
    <h1>ECHO IGNITION</h1>
    
    <!-- Compact Top Login Form -->
    <div class="header-auth">
      <form action="play.html" method="get" class="compact-auth-form">
        <input type="text" id="username" name="username" placeholder="User" required>
        <input type="password" id="password" name="password" placeholder="Pass" required>
        <button type="submit" class="btn-compact">Login</button>
      </form>
      <div id="user-display" class="user-badge">Status: <span id="username-val" class="highlight">Guest</span></div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="main-content">
    
    <!-- Hero Card with Logo -->
    <div class="card hero-card">
      <img src="https://via.placeholder.com/150/1e1e24/e2b714?text=Echo+Ignition" alt="Echo Ignition Logo" class="app-logo">
      <h2>Cool text</h2>
      <p>More cool text</p>
    </div>


  </main>

  <!-- Bottom Navigation -->
  <nav class="bottom-banner">
    <a href="help.html" class="nav-btn btn-secondary">HELP</a>
    <a href="play.html" class="nav-btn btn-primary">PLAY</a>
    <a href="stats.html" class="nav-btn btn-secondary">STATS</a>
  </nav>

</body>
</html>
