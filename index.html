<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Echo Ignition</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Top header + login -->
  <header class="top-banner">
    <h1>ECHO IGNITION</h1>
    
    <div class="header-auth">
      <form action="play.html" method="get" class="compact-auth-form">
        <input type="text" placeholder="User">
        <input type="password" placeholder="Pass">
        <button type="submit" class="btn-compact">Login</button>
      </form>
      <p class="user-badge">Status: <span class="highlight">Guest</span></p>
    </div>
  </header>

  <!-- Main Content -->
  <main class="main-content">
    <div class="card hero-card">
      <img src="echoignitionLogoPlaceholder.png" alt="Echo Ignition Logo - Flamethrower Horse" class="app-logo">
      <h2>Cool text</h2>
      <p>More cool text</p>
    </div>
  </main>

 <!-- Footer -->
  <footer class="site-footer">
    <p>Author: <strong>Sanford Reynolds</strong> | <a href="https://github.com/sreynolds42/startupApplication" target="_blank">GitHub Repository</a></p>
  </footer>

  <!-- Bottom Navigation -->
  <nav class="bottom-banner">
    <a href="help.html" class="nav-btn btn-secondary">HELP</a>
    <a href="play.html" class="nav-btn btn-primary">PLAY</a>
    <a href="stats.html" class="nav-btn btn-secondary">STATS</a>
  </nav>

</body>
</html>
