<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Echo Ignition - Home</title>
  <!-- bootstrap install here-->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- style.css override-->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Top header + login -->
  <header class="top-banner">
    <h1>ECHO IGNITION</h1>
    
    <div class="header-auth">
      <form action="play.html" method="get" class="d-flex gap-1 justify-content-center w-100" style="max-width: 320px;">
        <input type="text" class="form-control form-control-sm bg-dark text-white border-secondary" placeholder="User">
        <button type="submit" class="btn btn-warning btn-sm fw-bold">Login</button>
      </form>
      <p class="user-badge mt-1">Status: <span class="badge text-bg-warning">Guest</span></p>
    </div>
  </header>

  <!-- Main Content -->
  <main class="main-content">
    <div class="card hero-card">
      <img src="echoignitionLogoPlaceholder.png" alt="Echo Ignition Logo - Flamethrower Horse" class="app-logo">
      <h2 class="text-white h5">Triumph over your enemies</h2>
      <p class="text-white small mb-0">Welcome to echo ignition, the RPG chess game !</p>
    </div>
  </main>

 <!-- Footer -->
  <footer class="site-footer">
    <p>Author: <strong>Sanford Reynolds</strong> | <a href="https://github.com/sreynolds42/startupApplication" target="_blank">GitHub Repository</a></p>
  </footer>

  <!-- Bottom Navigation -->
  <nav class="bottom-banner">
    <a href="help.html" class="nav-btn btn-secondary">HELP</a>
    <a href="play.html" class="nav-btn btn-primary">PLAY</a>
    <a href="stats.html" class="nav-btn btn-secondary">STATS</a>
  </nav>

</body>
</html>
