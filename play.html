<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Echo Ignition - Play</title>
  <!-- Bootstrap CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="top-banner">
    <h1>ECHO IGNITION</h1>
    <button class="btn btn-sm btn-outline-warning text-white position-absolute end-0 top-50 translate-middle-y me-2">Daily Puzzle</button>
    <div class="game-status">Turn: <span class="highlight">Guest</span></div>
  </header>

  <main class="main-content play-layout">
    <!-- Board Placeholder -->
    <section class="board-container">
      <div class="chess-board">
        <!-- row 1 -->
        <div class="square dark">♜</div>
        <div class="square light">♞</div>
        <div class="square dark">♝</div>
        <div class="square light">♚</div>
        <div class="square dark">♛</div>
        <div class="square light">♝</div>
        <div class="square dark">♞</div>
        <div class="square light">♜</div>
        <!-- row 2 -->
        <div class="square light">♟</div>
        <div class="square dark">♟</div>
        <div class="square light">♟</div>
        <div class="square dark">♟</div>
        <div class="square light">♟</div>
        <div class="square dark">♟</div>
        <div class="square light">♟</div>
        <div class="square dark">♟</div>
        <!-- row 3 -->
        <div class="square dark"></div>
        <div class="square light"></div>
        <div class="square dark"></div>
        <div class="square light"></div>
        <div class="square dark"></div>
        <div class="square light"></div>
        <div class="square dark"></div>
        <div class="square light"></div>
        <!-- row 4 -->
        <div class="square light"></div>
        <div class="square dark"></div>
        <div class="square light"></div>
        <div class="square dark"></div>
        <div class="square light"></div>
        <div class="square dark"></div>
        <div class="square light"></div>
        <div class="square dark"></div>
        <!-- row 5 -->
        <div class="square dark"></div>
        <div class="square light"></div>
        <div class="square dark"></div>
        <div class="square light"></div>
        <div class="square dark"></div>
        <div class="square light"></div>
        <div class="square dark"></div>
        <div class="square light"></div>
        <!-- row 6 -->
        <div class="square light"></div>
        <div class="square dark"></div>
        <div class="square light"></div>
        <div class="square dark"></div>
        <div class="square light"></div>
        <div class="square dark"></div>
        <div class="square light"></div>
        <div class="square dark"></div>
        <!-- row 7 -->
        <div class="square dark">♙</div>
        <div class="square light">♙</div>
        <div class="square dark">♙</div>
        <div class="square light">♙</div>
        <div class="square dark">♙</div>
        <div class="square light">♙</div>
        <div class="square dark">♙</div>
        <div class="square light">♙</div>
        <!-- row 8 -->
        <div class="square light">♜</div>
        <div class="square dark">♞</div>
        <div class="square light">♝</div>
        <div class="square dark">♚</div>
        <div class="square light">♛</div>
        <div class="square dark">♝</div>
        <div class="square light">♞</div>
        <div class="square dark">♜</div>
      </div>
    </section>

    <!-- Ability Buttons -->
    <div class="btn-group my-3 w-100" role="group" style="max-width: 380px;">
      <button type="button" class="btn btn-lg text-white fw-bold" style="background-color: #0d6efd; border-color: #0d6efd;">Echo</button>
      <button type="button" class="btn btn-lg text-white fw-bold" style="background-color: #dc3545; border-color: #dc3545;">Ignite</button>
    </div>

    <!-- Feed + Player to player chat -->
    <section class="card websocket-card">
      <div class="feed-box">
        <p class="ws-msg mb-0">Websocket Chat</p>
      </div>
    </section>
  </main>

  <nav class="bottom-banner">
    <a href="help.html" class="nav-btn btn-secondary">HELP</a>
    <a href="index.html" class="nav-btn btn-primary">HOME</a>
    <a href="stats.html" class="nav-btn btn-secondary">STATS</a>
  </nav>

</body>
</html>
