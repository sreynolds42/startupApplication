<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Echo Ignition - Play</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="top-banner">
      <h1>ECHO IGNITION</h1>
      <button class="btn-puzzle-header" onclick="alert('Daily Puzzle API call placeholder')">Daily Puzzle</button>
    <div class="game-status">Turn: <span class="highlight">Player 1</span></div>
  </header>

  <main class="main-content play-layout">
    <!-- Board Placeholder -->
    <section class="board-container">
      <div class="chess-board">
        <!-- Will eventually replace numbers with a bar, so fancy formatting for hp isnt really necessary atm-->
         <!-- row 1 -->
        <div class="square dark">♜</div>
        <div class="square light">♞</div>
        <div class="square dark">♝</div>
        <div class="square light">♚</div>
        <div class="square dark">♛</div>
        <div class="square light">♝</div>
        <div class="square dark">♞</div>
        <div class="square light">♜</div>
        <!-- row 2 -->
        <div class="square light">♟</div>
        <div class="square dark">♟</div>
        <div class="square light">♟</div>
        <div class="square dark">♟</div>
        <div class="square light">♟</div>
        <div class="square dark">♟</div>
        <div class="square light">♟</div>
        <div class="square dark">♟</div>
        <!-- row 3 -->
        <div class="square dark"></div>
        <div class="square light"></div>
        <div class="square dark"></div>
        <div class="square light"></div>
        <div class="square dark"></div>
        <div class="square light"></div>
        <div class="square dark"></div>
        <div class="square light"></div>
        <!-- row 4 -->
        <div class="square light"></div>
        <div class="square dark"></div>
        <div class="square light"></div>
        <div class="square dark"></div>
        <div class="square light"></div>
        <div class="square dark"></div>
        <div class="square light"></div>
        <div class="square dark"></div>
        <!-- row 5 -->
        <div class="square dark"></div>
        <div class="square light"></div>
        <div class="square dark"></div>
        <div class="square light"></div>
        <div class="square dark"></div>
        <div class="square light"></div>
        <div class="square dark"></div>
        <div class="square light"></div>
        <!-- row 6 -->
        <div class="square light"></div>
        <div class="square dark"></div>
        <div class="square light"></div>
        <div class="square dark"></div>
        <div class="square light"></div>
        <div class="square dark"></div>
        <div class="square light"></div>
        <div class="square dark"></div>
        <!-- row 7 -->
        <div class="square dark">♙</div>
        <div class="square light">♙</div>
        <div class="square dark">♙</div>
        <div class="square light">♙</div>
        <div class="square dark">♙</div>
        <div class="square light">♙</div>
        <div class="square dark">♙</div>
        <div class="square light">♙</div>
        <!-- row 8 -->
        <div class="square light">♜</div>
        <div class="square dark">♞</div>
        <div class="square light">♝</div>
        <div class="square dark">♚</div>
        <div class="square light">♛</div>
        <div class="square dark">♝</div>
        <div class="square light">♞</div>
        <div class="square dark">♜</div>

        
      </div>
    </section>

    <!-- Ability Buttons -->
    <section class="ability-bar">
      <button class="btn-ability">Echo</button>
      <button class="btn-ability">Ignite</button>
    </section>

    <!-- Feed + Player to player chat -->
    <section class="card websocket-card">
      <div class="feed-box">
        <p class="ws-msg">Websocket Chat</p>
      </div>
    </section>

    
  </main>

  <nav class="bottom-banner">
    <a href="help.html" class="nav-btn btn-secondary">HELP</a>
    <a href="index.html" class="nav-btn btn-primary">HOME</a>
    <a href="stats.html" class="nav-btn btn-secondary">STATS</a>
  </nav>

</body>
</html>
